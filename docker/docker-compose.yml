services:

  # ─── ASP.NET Core API ────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=StreamBG;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=StreamBG
      - Jwt__Audience=StreamBG-Users
      - MediaServer__RtmpUrl=rtmp://nginx-rtmp:1935/live
      - MediaServer__HlsBaseUrl=http://nginx-rtmp:8080/hls
      - Vod__PublicBaseUrl=http://nginx-rtmp:8080/vod
      - Vod__OutputPath=/data/vod
      - Vod__RecordingsPath=/data/recordings
      - Clips__OutputPath=/data/clips
      # CDN — set Cdn__Enabled=true and fill in the remaining vars to activate
      - Cdn__Enabled=${CDN_ENABLED:-false}
      - Cdn__Provider=${CDN_PROVIDER:-None}
      - Cdn__HlsBaseUrl=${CDN_HLS_BASE_URL:-}
      - Cdn__VodBaseUrl=${CDN_VOD_BASE_URL:-}
      - Cdn__ThumbnailBaseUrl=${CDN_THUMBNAIL_BASE_URL:-}
      # Cloudflare
      - Cdn__Cloudflare__ZoneId=${CF_ZONE_ID:-}
      - Cdn__Cloudflare__ApiToken=${CF_API_TOKEN:-}
      # CloudFront
      - Cdn__CloudFront__DistributionId=${CF_DISTRIBUTION_ID:-}
      - Cdn__CloudFront__AccessKeyId=${AWS_ACCESS_KEY_ID:-}
      - Cdn__CloudFront__SecretAccessKey=${AWS_SECRET_ACCESS_KEY:-}
      - Cdn__CloudFront__Region=${AWS_REGION:-us-east-1}
      - Cdn__CloudFront__UseSignedUrls=${CF_USE_SIGNED_URLS:-false}
      - Cdn__CloudFront__KeyPairId=${CF_KEY_PAIR_ID:-}
      - Cdn__CloudFront__SignedUrlExpiryMinutes=${CF_URL_EXPIRY_MINUTES:-60}
    volumes:
      - vod_data:/data/vod
      - recordings_data:/data/recordings
      - clips_data:/data/clips
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── React / Vite Web Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
      - nginx-rtmp
    restart: unless-stopped

  # ─── nginx-rtmp медиа сървър (с FFmpeg за ABR) ────────────────────────────────
  nginx-rtmp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/abr-transcode.sh:/etc/nginx/abr-transcode.sh
      - hls_data:/tmp/hls
      - vod_data:/data/vod
      - recordings_data:/data/recordings
      - clips_data:/data/clips
    depends_on:
      - api
    restart: unless-stopped

  # ─── SQL Server ───────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -No 2>/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sql_data:
  redis_data:
  hls_data:
  vod_data:
  recordings_data:
  clips_data:
