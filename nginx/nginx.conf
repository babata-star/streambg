worker_processes auto;
events {
    worker_connections 1024;
}

# ─── RTMP server ───────────────────────────────────────────────────────────────
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;

            # ── Auth callbacks ─────────────────────────────────────────────────
            on_publish      http://api:5000/rtmp/on-publish;
            on_publish_done http://api:5000/rtmp/on-publish-done;

            # ── ABR transcoding (720p / 480p / 360p) ──────────────────────────
            # exec fires once when the stream starts; the script starts FFmpeg
            # which subscribes to the stream as a player (no recursion).
            exec /etc/nginx/abr-transcode.sh $name;

            # ── VOD recording ─────────────────────────────────────────────────
            # Saves the raw stream so the API can transcode it to VOD later.
            record         all;
            record_path    /data/recordings;
            record_unique  on;
            on_record_done http://api:5000/rtmp/on-record-done;
        }
    }
}

# ─── HTTP server ───────────────────────────────────────────────────────────────
http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Shared gzip settings — CDNs prefer pre-compressed assets
    gzip             on;
    gzip_types       application/vnd.apple.mpegurl application/json text/plain;
    gzip_min_length  1024;

    server {
        listen 8080;

        # ── CORS preflight helper ─────────────────────────────────────────────
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── Live ABR master playlist — never cache ─────────────────────────────
        # Written by abr-transcode.sh when the stream starts.
        location ~ ^/hls/[^/]+/master\.m3u8$ {
            types { application/vnd.apple.mpegurl m3u8; }
            root /tmp;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # ── Live quality-variant playlists — never cache ───────────────────────
        # Each quality subdirectory contains its own rolling index.m3u8.
        location ~ ^/hls/[^/]+/(720p|480p|360p)/index\.m3u8$ {
            types { application/vnd.apple.mpegurl m3u8; }
            root /tmp;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # ── Live HLS segments — short CDN TTL matching the 2 s segment duration ─
        location ~ ^/hls/[^/]+/(720p|480p|360p)/[0-9]+\.ts$ {
            types { video/mp2t ts; }
            root /tmp;
            add_header Cache-Control "public, max-age=5, s-maxage=5" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # ── Fallback: any remaining /hls/* not matched above ──────────────────
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /tmp;
            add_header Cache-Control "no-store, no-cache" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # ── VOD master / sub-playlists — cache 1 hour ─────────────────────────
        location ~ ^/vod/.+\.m3u8$ {
            root /data;
            add_header Cache-Control "public, max-age=3600, s-maxage=3600" always;
            add_header Vary          "Accept-Encoding" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # ── VOD segments — immutable for 7 days ───────────────────────────────
        location ~ ^/vod/.+\.(ts|aac|mp4)$ {
            root /data;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header Vary          "Accept-Encoding" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # ── Clips (MP4 + JPEG thumbnail) — cache 24 h, byte-range supported ────
        location ~ ^/clips/[^/]+\.(mp4|jpg)$ {
            root /data;
            add_header Cache-Control    "public, max-age=86400" always;
            add_header Accept-Ranges    bytes always;
            add_header Access-Control-Allow-Origin  * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        }

        # ── Thumbnails — cache for 1 hour ─────────────────────────────────────
        location /thumbnails {
            root /data;
            add_header Cache-Control "public, max-age=3600" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # ── RTMP stats (restricted to localhost) ──────────────────────────────
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            allow 127.0.0.1;
            deny  all;
        }

        location /control {
            rtmp_control all;
            allow 127.0.0.1;
            deny  all;
        }
    }
}
