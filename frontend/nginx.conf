# Use Docker's internal DNS resolver — resolves service names per-request,
# not at startup. This prevents "host not found in upstream" when the api
# container hasn't started yet.
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all paths go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        set $upstream_api api:5000;
        proxy_pass http://$upstream_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket proxy
    location /hubs/ {
        set $upstream_api api:5000;
        proxy_pass http://$upstream_api/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # HLS streams from nginx-rtmp
    location /hls/ {
        set $upstream_rtmp nginx-rtmp:8080;
        proxy_pass http://$upstream_rtmp/hls/;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
