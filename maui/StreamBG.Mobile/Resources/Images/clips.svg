<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Film strip frame -->
  <rect x="2" y="4" width="20" height="16" rx="2"/>
  <!-- Left perforations -->
  <rect x="2" y="4" width="4" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="2" y="10" width="4" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="2" y="16" width="4" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <!-- Right perforations -->
  <rect x="18" y="4" width="4" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="18" y="10" width="4" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="18" y="16" width="4" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <!-- Play triangle -->
  <polygon points="10,9 16,12 10,15" fill="currentColor"/>
</svg>
